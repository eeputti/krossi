<style>
  /* Same look as the new Koutsi app (koutsi/web/src/styles/tokens.css): flat and high-contrast on
     white — neutral greys, near-black for dark surfaces, lime as the one accent, borders and
     grey fills instead of shadows. */
  :root {
    --lime: #CFE414;
    --lime-300: #DBEE45;
    --lime-100: #F4F8D9;
    --paper: #FFFFFF;
    --sand: #F1F1F1;
    --line: #E8E8E8;
    --line-strong: #D4D4D4;
    --ink: #121212;
    --ink-2: #333333;
    --muted: #6A6A6A;
    --faint: #969696;
    --dark: #121212;
    --dark-2: #2A2A2A;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: hidden; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }
  a { color: inherit; }

  .koutsi-badge {
    display: inline-flex; align-items: center;
    font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    background: var(--sand); color: var(--ink-2);
    padding: 3px 10px; border-radius: 999px;
  }

  /* ── buttons ── */
  .btn-lime, .btn-outline {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; font-weight: 700; cursor: pointer; text-decoration: none;
    transition: background .2s, border-color .2s; border: none;
    font-family: inherit; line-height: 1;
  }
  .btn-lime { background: var(--lime); color: var(--ink); }
  .btn-lime:hover { background: var(--lime-300); }
  .btn-outline { background: transparent; border: 1.5px solid currentColor; color: var(--ink); }
  .btn-outline:hover { background: rgba(0,0,0,0.04); }
  .btn-lg { padding: 17px 30px; font-size: 16.5px; }
  .btn-sm { padding: 10px 18px; font-size: 14px; }
  .btn-dark { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; font-weight: 700; cursor: pointer; text-decoration: none; border: none; background: var(--dark); color: #fff; transition: background .2s; font-family: inherit; line-height: 1; }
  .btn-dark:hover { background: var(--dark-2); }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow-light { color: rgba(255,255,255,0.82); }
  .ball-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); }

  /* ── nav ── */
  .nav-wrap { position: sticky; top: 0; z-index: 40; display: flex; justify-content: center; padding: 14px 16px 0; pointer-events: none; }
  .nav-pill {
    pointer-events: auto; display: flex; align-items: center; gap: clamp(10px,2vw,26px);
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
    border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 8px 8px 22px;
    max-width: 760px; width: 100%;
  }
  .nav-logo { text-decoration: none; margin-right: auto; }
  .nav-links { display: flex; gap: clamp(14px,2.4vw,30px); }
  .nav-links a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; transition: color .15s; }
  .nav-links a:hover { color: var(--ink); }
  @media (max-width: 620px) { .nav-links { display: none; } .nav-logo { margin-right: 0; } .nav-pill { width: auto; } }

  /* lime under a word (also in the tools section) */
  .hl { background: var(--lime); padding: 0 0.08em; line-height: 0.72; border-radius: 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  /* ── the film at the top (lib/koutsi-film.jsx) ──
     Sizes inside .kf-canvas are canvas units: the canvas is 1600 × 900 (900 × 1350 on a phone)
     and scaled to the stage's width. The script under the title hides the prerendered last frame
     (data-frozen) until React has drawn the film's first frame, so the end never flashes first. */
  .kf { padding: 8px 16px 0; }
  .kf-stage { position: relative; width: 100%; max-width: 1200px; margin: 0 auto; overflow: hidden; border-radius: 28px; background: #fff; }
  /* never taller than the window leaves room for: the button under it stays in sight */
  .kf.is-wide .kf-stage { width: min(100%, calc((100vh - 210px) * 16 / 9)); width: min(100%, calc((100svh - 210px) * 16 / 9)); }
  .kf.is-tall .kf-stage { width: min(100%, calc((100vh - 200px) * 2 / 3)); width: min(100%, calc((100svh - 200px) * 2 / 3)); }
  .kf-canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .kf-anim .kf-stage[data-frozen] .kf-canvas { visibility: hidden; }
  .kf-film, .kf-end, .kf-layer { position: absolute; inset: 0; }
  .kf-film > *, .kf-layer > * { position: absolute; left: 0; top: 0; }
  .kf-line { position: absolute; left: 0; text-align: center; white-space: nowrap; font-weight: 800; letter-spacing: -0.045em; line-height: 1.06; color: var(--ink); }
  .kf-mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.12em 0.14em; margin: 0 -0.12em -0.14em; }
  .kf-word { display: inline-block; position: relative; isolation: isolate; }
  .kf-word-hl { position: absolute; left: -0.06em; right: -0.06em; top: 0.2em; bottom: 0.06em; background: var(--lime); z-index: -1; transform-origin: 0 50%; transform: scaleX(0); }
  .kf-hl-word { position: relative; display: inline-block; isolation: isolate; }
  .kf-hook-hl { position: absolute; left: 0; top: 0; background: var(--lime); }
  .kf-eyebrow { display: flex; align-items: center; justify-content: center; gap: 0.5em; font-size: 22px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .kf-eyebrow i { width: 0.5em; height: 0.5em; border-radius: 50%; background: var(--lime); }
  .kf-end-eyebrow { position: absolute; left: 0; }
  .kf-h1 { margin: 0; font-weight: 800; }

  /* drawn phones */
  .kf-ph { width: 380px; height: 780px; border-radius: 62px; background: #fff; box-shadow: inset 0 0 0 4px var(--ink); transform-origin: 0 0; overflow: hidden; }
  .kf-ph-isl { position: absolute; top: 18px; left: 50%; width: 104px; height: 30px; margin-left: -52px; border-radius: 15px; background: var(--ink); }
  .kf-scr { position: absolute; left: 20px; top: 62px; width: 340px; display: flex; flex-direction: column; gap: 14px; }
  .kf-bar { position: absolute; left: 4px; right: 4px; bottom: 4px; height: 76px; border-top: 2px solid var(--line); display: flex; align-items: center; justify-content: space-around; background: #fff; border-radius: 0 0 58px 58px; }
  .kf-bar i { width: 26px; height: 26px; border-radius: 8px; border: 3px solid var(--line-strong); }
  .kf-bar b { position: relative; width: 62px; height: 62px; border-radius: 50%; background: var(--lime); margin-top: -26px; }
  .kf-bar b::before, .kf-bar b::after { content: ""; position: absolute; left: 50%; top: 50%; width: 24px; height: 4px; margin: -2px 0 0 -12px; background: var(--ink); border-radius: 2px; }
  .kf-bar b::after { transform: rotate(90deg); }
  .kf-hdr { height: 178px; background: var(--ink); border-radius: 28px; padding: 20px 20px 18px; color: #fff; }
  .kf-hdr-sm { height: 150px; }
  .kf-wk { font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: var(--lime); }
  .kf-hi { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; margin: 8px 0 14px; }
  .kf-hdr-sub { font-size: 17px; color: #bbb; margin-top: -8px; }
  .kf-days { display: flex; gap: 6px; }
  .kf-days span { flex: 1; height: 50px; border-radius: 12px; background: var(--dark-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 800; color: #9a9a9a; }
  .kf-days span.on { box-shadow: inset 0 0 0 2.5px var(--lime); color: #fff; }
  .kf-days span i { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }
  .kf-days span i.o { background: transparent; box-shadow: inset 0 0 0 1.5px #777; }
  .kf-sec { font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: var(--faint); text-transform: uppercase; margin-top: 4px; }
  .kf-title { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin-top: 4px; }
  .kf-gc { height: 76px; border: 2px solid var(--line); border-radius: 22px; padding: 0 16px; display: flex; align-items: center; gap: 14px; }
  .kf-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--lime); flex-shrink: 0; }
  .kf-dot.g { background: var(--line-strong); }
  .kf-gc-t { flex: 1; min-width: 0; }
  .kf-gc-t small { display: block; font-size: 14px; font-weight: 700; color: var(--faint); }
  .kf-gc-t strong { display: block; font-size: 21px; letter-spacing: -0.02em; }
  .kf-avs { display: flex; }
  .kf-avs u { width: 28px; height: 28px; border-radius: 50%; background: var(--sand); border: 2.5px solid #fff; margin-left: -8px; }
  .kf-avs u.l, .kf-arow u.l, .kf-chip u.l { background: var(--lime); }
  .kf-who { font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .kf-who em { font-style: normal; background: var(--lime); color: var(--ink); border-radius: 99px; padding: 3px 9px; letter-spacing: 0.04em; }
  .kf-theme { height: 150px; background: var(--lime-100); border: 2px solid var(--lime); border-radius: 24px; padding: 16px 18px; }
  .kf-theme strong { display: block; font-size: 34px; letter-spacing: -0.03em; margin-top: 6px; }
  .kf-theme p { margin: 6px 0 0; font-size: 17px; font-weight: 600; color: var(--ink-2); line-height: 1.35; }
  .kf-note { position: relative; height: 150px; border: 2px solid var(--line); border-radius: 24px; padding: 16px 18px; background: #fff; }
  .kf-note p { margin: 8px 0 0; font-size: 21px; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; }
  .kf-note-glow { position: absolute; inset: -4px; border: 4px solid var(--lime); border-radius: 26px; box-shadow: 0 0 0 7px rgba(207, 228, 20, 0.28); }
  .kf-arow { height: 64px; display: flex; align-items: center; gap: 12px; border: 2px solid var(--line); border-radius: 18px; padding: 0 14px; }
  .kf-arow u { width: 34px; height: 34px; border-radius: 50%; background: var(--sand); flex-shrink: 0; }
  .kf-arow strong { flex: 1; font-size: 20px; letter-spacing: -0.01em; line-height: 1.15; }
  .kf-arow small { display: block; font-size: 14px; color: #B4521C; font-weight: 700; }
  .kf-mark { position: relative; width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 2px var(--line); }
  .kf-chk, .kf-x { position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; transform: scale(0); }
  .kf-chk { background: var(--lime); }
  .kf-chk::after { content: ""; position: absolute; left: 9px; top: 9px; width: 11px; height: 6px; border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(-45deg); }
  .kf-x { background: var(--ink); }
  .kf-x::before, .kf-x::after { content: ""; position: absolute; left: 13.5px; top: 7px; width: 3px; height: 16px; background: #fff; border-radius: 2px; transform: rotate(45deg); }
  .kf-x::after { transform: rotate(-45deg); }
  .kf-btns { display: flex; gap: 10px; }
  .kf-btn2 { position: relative; flex: 1; height: 58px; border-radius: 29px; box-shadow: inset 0 0 0 2.5px var(--ink); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; }
  .kf-tap { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; border-radius: 50%; background: rgba(18, 18, 18, 1); opacity: 0; pointer-events: none; }

  /* drawn cards */
  .kf-grid { border-radius: 30px; box-shadow: inset 0 0 0 3px var(--ink); padding: 26px 28px; background: #fff; }
  .kf-grid table { width: 100%; border-collapse: separate; border-spacing: 8px 12px; }
  .kf-grid th { font-size: 17px; font-weight: 800; color: var(--faint); text-align: left; letter-spacing: 0.04em; }
  .kf-grid td { height: 46px; padding: 0; }
  .kf-grid td.n { font-size: 20px; font-weight: 800; width: 130px; letter-spacing: -0.01em; }
  .kf-pill { height: 42px; border-radius: 21px; background: var(--sand); display: flex; align-items: center; padding: 0 14px; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; }
  .kf-fly { display: flex; align-items: center; padding: 0 14px; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; }
  .kf-field { border-radius: 30px; box-shadow: inset 0 0 0 3px var(--ink); background: #fff; padding: 44px 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; }
  .kf-caret { display: inline-block; width: 0.09em; height: 1.05em; background: var(--ink); vertical-align: -0.16em; margin-left: 0.06em; }
  .kf-send { position: absolute; right: 26px; bottom: 26px; width: 96px; height: 96px; border-radius: 50%; background: var(--lime); display: flex; align-items: center; justify-content: center; }
  .kf-field-eyebrow { justify-content: flex-start; }
  .kf-court { position: absolute; inset: 0; background: var(--lime-100); }
  .kf-court-lines { position: absolute; left: 0; top: 0; overflow: visible; }
  .kf-shadow { position: absolute; left: 0; top: 0; border-radius: 50%; background: rgba(18, 18, 18, 0.9); filter: blur(4px); }
  .kf-ball { position: absolute; left: 0; top: 0; }
  .kf-video { border-radius: 30px; background: var(--ink); overflow: hidden; }
  .kf-video > svg { position: absolute; inset: 0; }
  .kf-play { position: absolute; left: 50%; top: 46%; width: 110px; height: 110px; border-radius: 50%; background: var(--lime); transform: translate(-50%, -50%); }
  .kf-play::after { content: ""; position: absolute; left: 43px; top: 32px; border-left: 36px solid var(--ink); border-top: 23px solid transparent; border-bottom: 23px solid transparent; }
  .kf-scrub { position: absolute; left: 34px; right: 34px; bottom: 30px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.25); }
  .kf-scrub i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--lime); border-radius: 4px; }
  .kf-scrub b { position: absolute; left: 0; top: -9px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: #fff; }
  .kf-vtag { position: absolute; left: 34px; bottom: 62px; background: #fff; color: var(--ink); border-radius: 14px; padding: 10px 16px; font-size: 20px; font-weight: 800; }
  .kf-chips { display: flex; justify-content: center; gap: 12px; }
  .kf-chip { display: inline-flex; align-items: center; gap: 10px; box-shadow: inset 0 0 0 2px var(--line); border-radius: 99px; padding: 10px 18px 10px 10px; font-size: 21px; font-weight: 800; }
  .kf-chip u { width: 30px; height: 30px; border-radius: 50%; background: var(--sand); }
  /* the court: who is at which end, and the note riding on the ball */
  .kf-side { position: absolute; left: 0; top: 0; background: #fff; }
  .kf-msg { background: #fff; box-shadow: inset 0 0 0 2px var(--ink); border-radius: 99px; padding: 0.35em 0.8em; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; color: var(--ink); }
  .kf-mile { position: absolute; display: flex; align-items: center; gap: 12px; background: #fff; box-shadow: inset 0 0 0 2.5px var(--line); border-radius: 18px; padding: 12px 18px 12px 14px; white-space: nowrap; }
  .kf-mile i { width: 16px; height: 16px; border-radius: 50%; background: var(--lime); flex-shrink: 0; }
  .kf-mile i.g { background: var(--ink); }
  .kf-mile span { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
  .kf-mile small { display: block; font-size: 15px; font-weight: 800; color: var(--faint); letter-spacing: 0.06em; text-transform: uppercase; }
  .kf-mile.is-goal { background: var(--lime-100); box-shadow: inset 0 0 0 2.5px var(--lime); }
  .kf-tag { position: absolute; background: var(--ink); color: #fff; border-radius: 99px; padding: 12px 22px; font-size: 24px; font-weight: 800; white-space: nowrap; }

  /* the stack and the wordmark it turns into */
  .kf-stack-line { transform-origin: 50% 55%; }
  .kf-logo { display: inline-flex; align-items: flex-end; }
  .kf-roll { display: inline-block; overflow: hidden; height: 1.06em; padding-bottom: 0.22em; margin-bottom: -0.22em; vertical-align: top; box-sizing: content-box; }
  .kf-roll-in { display: flex; flex-direction: column; align-items: flex-start; }
  .kf-roll-in > span { display: block; height: 1.06em; white-space: nowrap; }
  .kf-logo-ball { display: inline-block; width: 0; height: 0.32em; margin-bottom: 0.17em; overflow: visible; }
  .kf-logo-ball-in { display: block; width: 0.32em; height: 0.32em; margin-left: 0.07em; }
  .kf-logo-sub { display: inline-block; width: 0; overflow: hidden; white-space: nowrap; margin-bottom: 0.12em; }
  .kf-logo-sub > span { display: inline-block; padding-left: 0.28em; font-size: 0.42em; letter-spacing: -0.01em; color: var(--muted); }

  /* under the film: the button that never moves, and "again" once it has ended */
  .kf-actions { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: clamp(20px, 3vw, 28px) 16px clamp(30px, 5vw, 54px); }
  /* replay: in the empty space under the film's last words, once it has ended */
  .kf-replay { position: absolute; left: 50%; top: 81%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: #fff; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s linear .6s, border-color .15s; }
  .kf.is-tall .kf-replay { top: 85%; }
  .kf[data-state="end"] .kf-replay { opacity: 1; visibility: visible; transition: opacity .8s ease .3s, visibility 0s, border-color .15s; }
  .kf-replay:hover { border-color: var(--ink); }

  /* ── how it works (dark section) ── */
  .steps { background: var(--dark); color: #fff; padding: clamp(56px,9vw,110px) 22px; }
  .steps-inner { max-width: 1120px; margin: 0 auto; text-align: center; }
  .steps h2 { margin: 10px 0 clamp(32px,5vw,54px); font-size: clamp(2rem,5.6vw,3rem); font-weight: 800; letter-spacing: -0.03em; }
  .steps-grid { display: grid; grid-template-columns: 1fr; gap: 22px; text-align: left; }
  @media (min-width: 780px) { .steps-grid { grid-template-columns: repeat(3, 1fr); gap: 26px; } }
  .step-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 24px 22px; }
  .step-n {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%; background: var(--lime); color: var(--ink);
    font-weight: 800; font-size: 14px; margin-bottom: 14px;
  }
  .step-card h3 { margin: 0 0 8px; font-size: 1.1rem; font-weight: 800; letter-spacing: -0.01em; }
  .step-card p { margin: 0; font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.7); }

  /* ── the coach's tools: the app on a laptop (lib/koutsi-laptop.jsx) ── */
  .tools { background: var(--paper); padding: clamp(56px,9vw,110px) 16px; }
  .tools-inner { max-width: 1120px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .tools h2 { margin: 10px 0 12px; font-size: clamp(2rem,5.6vw,3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
  .tools-sub { margin: 0 0 clamp(28px,4.5vw,48px); max-width: 560px; font-size: clamp(1rem,2.1vw,1.12rem); line-height: 1.55; color: var(--ink-2); }
  .lt { width: 100%; }
  .lt-device { width: min(100%, 720px); margin: 0 auto; }
  /* a picture, not a toy: the mouse can't drag, select or click anything on the laptop (the cards below change the view) */
  .lt-device, .lt-device * { pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
  .lt-lid { position: relative; background: #0d0d0d; border-radius: clamp(10px,1.8vw,18px) clamp(10px,1.8vw,18px) 4px 4px; padding: clamp(6px,1.2vw,12px) clamp(6px,1.2vw,12px) clamp(10px,1.8vw,18px); box-shadow: inset 0 0 0 1.5px #2b2b2b; }
  .lt-cam { position: absolute; top: clamp(2px,0.45vw,4px); left: 50%; width: 5px; height: 5px; border-radius: 50%; background: #2a2a2a; transform: translateX(-50%); }
  .lt-screen { aspect-ratio: 16 / 10; display: flex; flex-direction: column; overflow: hidden; border-radius: 4px; background: #fff; }
  .lt-chrome { flex-shrink: 0; background: #e9e9e9; }
  .lt-tabs { display: flex; align-items: flex-end; gap: 2px; padding: clamp(4px,0.8vw,8px) clamp(6px,1vw,10px) 0; min-width: 0; }
  .lt-dots { display: inline-flex; gap: clamp(3px,0.5vw,6px); margin: 0 clamp(6px,1.2vw,14px) clamp(6px,1vw,10px) 2px; flex-shrink: 0; }
  .lt-dots i { width: clamp(5px,0.9vw,10px); height: clamp(5px,0.9vw,10px); border-radius: 50%; background: #c9c9c9; }
  .lt-tab {
    flex: 0 1 160px; min-width: 0; display: inline-flex; align-items: center; gap: clamp(3px,0.5vw,7px);
    padding: clamp(4px,0.7vw,8px) clamp(5px,1vw,12px); border: 0; border-radius: 8px 8px 0 0; background: transparent;
    font: inherit; font-size: clamp(8px,1.25vw,12.5px); font-weight: 600; color: #5b5b5b; white-space: nowrap;
  }
  .lt-tab span { overflow: hidden; text-overflow: ellipsis; }
  .lt-tab img { width: clamp(8px,1.3vw,14px); height: auto; flex-shrink: 0; }
  .lt-tab.is-on { background: #fff; color: var(--ink); font-weight: 750; }
  .lt-bar { background: #fff; padding: clamp(3px,0.6vw,7px) clamp(6px,1vw,12px); border-bottom: 1px solid #e3e3e3; }
  .lt-url {
    display: flex; align-items: center; gap: 6px; padding: clamp(2px,0.45vw,5px) clamp(8px,1.2vw,14px); border-radius: 999px;
    background: #f0f0f0; font-size: clamp(8px,1.2vw,12.5px); color: #4a4a4a; white-space: nowrap; overflow: hidden; text-align: left;
  }
  .lt-url svg { flex-shrink: 0; color: #8a8a8a; width: clamp(7px,0.9vw,10px); height: auto; }
  .lt-view { position: relative; flex: 1; min-height: 0; background: #fff; }
  .lt-shot {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%;
    opacity: 0; transition: opacity .6s ease;
  }
  .lt-shot.is-on { opacity: 1; animation: lt-pan 4.2s ease-in-out both; }
  .lt-view.is-still .lt-shot { object-position: 50% 0%; animation: none; }
  @keyframes lt-pan { 0%, 20% { object-position: 50% 0%; } 100% { object-position: 50% 100%; } }
  @media (prefers-reduced-motion: reduce) { .lt-shot { transition: none; } .lt-shot.is-on { animation: none; object-position: 50% 0%; } }
  .lt-base { position: relative; height: clamp(8px,1.4vw,14px); margin: 0 -5%; border-radius: 0 0 clamp(8px,1.4vw,14px) clamp(8px,1.4vw,14px); background: linear-gradient(#dcdcdc, #b8b8b8); }
  .lt-base::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 15%; height: 40%; border-radius: 0 0 8px 8px; background: #a8a8a8; }
  .lt-cards { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: clamp(30px,4.5vw,48px); text-align: left; }
  @media (min-width: 620px) { .lt-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1000px) { .lt-cards { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; } }
  .lt-card {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 6px; padding: 18px 18px 20px; border-radius: 14px; text-align: left;
    background: #fff; border: 1.5px solid var(--line); font: inherit; color: var(--ink); cursor: pointer;
    transition: border-color .25s, background-color .25s;
  }
  .lt-card:hover { border-color: var(--line-strong); }
  .lt-card.is-on { border-color: var(--ink); background: var(--lime-100); }
  .lt-card-title { font-size: 1.02rem; font-weight: 800; letter-spacing: -0.01em; }
  .lt-card-text { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .lt-card-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--ink); transform-origin: left; animation: lt-fill 4.2s linear both; }
  @keyframes lt-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* ── closing ── */
  .closing {
    position: relative; overflow: hidden; text-align: center; color: #fff;
    display: grid; place-items: center; aspect-ratio: 1600 / 900;
    padding: clamp(14px,3vw,48px) 22px;
    background: url('assets/clay-court-left.jpg') center / cover no-repeat;
  }
  .closing-inner { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .closing h2 { margin: 0; font-size: clamp(2.2rem,6.5vw,3.4rem); font-weight: 800; letter-spacing: -0.03em; color: #fff; text-shadow: 0 2px 14px rgba(20,6,2,0.45); }
  .closing p { margin: 0 0 6px; font-size: clamp(1rem,2.1vw,1.12rem); color: var(--muted); line-height: 1.55; }

  /* ── footer ── */
  .footer { position: relative; overflow: hidden; background: var(--paper); color: var(--ink); padding: clamp(48px,8vw,88px) 22px clamp(30px,4vw,44px); }
  .footer::after {
    content: ''; position: absolute; right: -1%; bottom: -4%;
    width: min(44%, 380px); aspect-ratio: 620 / 430;
    background: url('assets/tennisballs.avif') right bottom / contain no-repeat;
    pointer-events: none;
  }
  .footer-inner { max-width: 1120px; margin: 0 auto; position: relative; z-index: 1; }
  .footer-tag { color: var(--ink-2); margin: 14px 0 22px; font-size: clamp(1.1rem,3vw,1.4rem); font-weight: 600; }
  .footer-links { display: flex; flex-direction: column; gap: 6px; }
  .footer-links a { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; }
  .footer-links a:hover { text-decoration: underline; text-underline-offset: 2px; }
  .footer-base { margin-top: clamp(28px,4vw,44px); padding-top: 0; border-top: none; color: var(--faint); font-size: 13px; }

  /* the shared cookie banner (lib/cookie-consent.js) in the same colours */
  #krossi-cookie-banner { border-color: var(--line) !important; border-radius: 14px !important; color: var(--ink) !important; }
  #krossi-cookie-banner a { color: var(--ink) !important; }
  #krossi-cookie-reject { border-color: var(--line-strong) !important; border-radius: 999px !important; color: var(--ink) !important; }
  #krossi-cookie-accept { background: var(--dark) !important; border-radius: 999px !important; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="dist/koutsi-landing.js"></script>
  <script src="lib/cookie-consent.js"></script>
</body>

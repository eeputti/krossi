<style>
  :root {
    --lime: #CFE414;
    --paper: #FFFFFF;
    --ink: #111111;
    --green-deep: #0E3B2C;
    --line: #D8D4CA;
    --hscale: 1;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: hidden; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }
  a { color: inherit; }

  /* ── phone demo skin (light) ── */
  .kp-light { background: #fff; }
  .kp-screen, .kp-scroll-x { scrollbar-width: none; }
  .kp-screen::-webkit-scrollbar, .kp-scroll-x::-webkit-scrollbar { display: none; }
  .kp-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px; padding: 15px 16px;
    box-shadow: 0 1px 3px rgba(20,15,5,0.05);
  }

  /* ── buttons ── */
  .btn-lime, .btn-outline {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; font-weight: 700; cursor: pointer; text-decoration: none;
    transition: transform .15s ease, box-shadow .2s ease, background .2s; border: none;
    font-family: inherit; line-height: 1;
  }
  .btn-lime { background: var(--lime); color: #101a08; box-shadow: 0 10px 24px -10px rgba(40,40,0,0.4); }
  .btn-lime:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -10px rgba(40,40,0,0.5); }
  .btn-outline { background: transparent; border: 1.6px solid currentColor; color: var(--ink); }
  .btn-outline:hover { transform: translateY(-2px); }
  .btn-lime, .btn-outline, .btn-dark, .btn-ghost { gap: 8px; }
  .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; font-weight: 700; cursor: pointer; text-decoration: none; font-family: inherit; line-height: 1;
    background: #fff; color: var(--green-deep); border: 1.6px solid rgba(14,59,44,0.22);
    transition: transform .15s ease, border-color .2s, background .2s;
  }
  .btn-ghost:hover { transform: translateY(-2px); border-color: var(--green-deep); }
  .btn-note { font-weight: 600; opacity: 0.72; margin-left: -2px; }
  .btn-lg { padding: 17px 30px; font-size: 16.5px; }
  .btn-sm { padding: 10px 18px; font-size: 14px; }

  .store-row { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .store-row-center { justify-content: center; }
  .store-badge {
    display: inline-flex; align-items: center; gap: 11px;
    background: #141414; color: #fff; border-radius: 15px; padding: 10px 18px 10px 16px;
    text-decoration: none; transition: transform .15s ease, background .2s;
  }
  .store-badge:hover { transform: translateY(-2px); background: #000; }
  .store-badge-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .store-badge-note { font-size: 10px; font-weight: 600; color: #8a857a; letter-spacing: 0.02em; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a6a4a;
  }
  .eyebrow-light { color: rgba(255,255,255,0.82); }
  .ball-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 3px rgba(207,228,20,0.25); }

  /* ── coach banner ── */
  .coach-banner {
    position: relative; background: var(--green-deep); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 10px 44px 10px 16px; font-size: 13.5px; font-weight: 600; text-align: center; line-height: 1.4;
  }
  .coach-banner a { color: var(--lime); text-decoration: underline; text-underline-offset: 2px; }
  .coach-banner-close {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: rgba(255,255,255,0.7); font-size: 19px; line-height: 1;
    cursor: pointer; padding: 6px; font-family: inherit;
  }
  .coach-banner-close:hover { color: #fff; }
  @media (max-width: 480px) { .coach-banner { font-size: 12.5px; padding: 9px 40px 9px 12px; } }

  /* ── nav ── */
  /* ── floating pill nav ── */
  .nav-wrap { position: sticky; top: 0; z-index: 40; display: flex; justify-content: center; padding: 14px 16px 0; pointer-events: none; }
  .nav-pill {
    pointer-events: auto; display: flex; align-items: center; gap: clamp(10px,2vw,26px);
    background: color-mix(in srgb, var(--paper) 78%, transparent);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    border-radius: 999px; padding: 8px 8px 8px 22px;
    box-shadow: 0 10px 30px -16px rgba(60,30,10,0.4);
    max-width: 760px; width: 100%;
  }
  .nav-logo { text-decoration: none; margin-right: auto; }
  .nav-links { display: flex; gap: clamp(14px,2.4vw,30px); }
  .nav-links a { text-decoration: none; color: #3c382f; font-weight: 600; font-size: 15px; transition: color .15s; }
  .nav-links a:hover { color: var(--ink); }
  @media (max-width: 620px) { .nav-links { display: none; } .nav-logo { margin-right: 0; } .nav-pill { width: auto; } }
  .btn-dark { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; font-weight: 700; cursor: pointer; text-decoration: none; border: none; background: var(--green-deep); color: #fff; transition: transform .15s ease, background .2s; font-family: inherit; line-height: 1; }
  .btn-dark:hover { transform: translateY(-1px); background: #0a2c20; }
  .btn-black { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; font-weight: 700; cursor: pointer; text-decoration: none; border: none; background: #141414; color: #fff; transition: transform .15s ease, background .2s; font-family: inherit; line-height: 1; }
  .btn-black:hover { transform: translateY(-2px); background: #000; }

  /* ── scroll story ── */
  .scroll-story { position: relative; }

  /* ── hero ── */
  .hero { max-width: 1120px; margin: 0 auto; padding: clamp(26px,5vw,60px) 22px clamp(44px,7vw,96px); display: grid; grid-template-columns: 1fr; gap: clamp(40px,5vw,56px); align-items: center; width: 100%; }
  @media (min-width: 940px) { .hero { grid-template-columns: 1.02fr 0.98fr; } }
  .hero-copy { display: flex; flex-direction: column; gap: 22px; }
  .hero-title {
    margin: 6px 0 0; font-weight: 800; letter-spacing: -0.035em; line-height: 1.0;
    font-size: calc(clamp(2.7rem, 9vw, 4.7rem) * var(--hscale));
  }
  .hl { background: var(--lime); padding: 0 0.08em; line-height: 0.72; border-radius: 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hero-sub { margin: 0; font-size: clamp(1.05rem, 2.3vw, 1.28rem); line-height: 1.45; color: #514c42; max-width: 34ch; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .hero-fine { margin: 2px 0 0; font-size: 14px; color: #8a857a; font-weight: 500; }
  .hero-visual { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; isolation: isolate; }
  .phone-caption { margin-top: 14px; font-size: 13px; font-weight: 600; color: #8a857a; letter-spacing: 0.01em; display: flex; align-items: center; gap: 5px; }
  .phone-caption svg { opacity: 0.6; }
  .phone-glow { position: absolute; inset: -6% -12%; z-index: 0; background: radial-gradient(circle at 50% 44%, rgba(14,59,44,0.16), transparent 64%); filter: blur(30px); }
  .hero-stage { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; }
  .phone-front { position: relative; z-index: 3; transform: rotate(-3deg); }
  .phone-back { position: relative; z-index: 1; margin-left: -72px; margin-top: 18px; transform: rotate(7deg); pointer-events: none; }
  @media (max-width: 1080px) { .hero-stage { transform: scale(0.94); } }
  @media (max-width: 720px) { .hero-stage { transform: scale(0.82); } }
  @media (max-width: 720px) { .hero-stage { margin-bottom: -60px; } }
  @media (max-width: 460px) { .hero-stage { transform: scale(0.66); transform-origin: center top; margin-bottom: -160px; } }

  /* ── features (zigzag, light cards) ── */
  .features { max-width: 1120px; margin: 0 auto; padding: clamp(34px,6vw,76px) 22px; }
  .sec-title { font-size: clamp(2.1rem,6.2vw,3.5rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 0 0 clamp(28px,4vw,46px); }
  .feat-zig { display: flex; flex-direction: column; gap: clamp(2px,0.8vw,10px); }
  .feat-card {
    display: flex; flex-direction: column; gap: 14px;
    border-radius: 28px; padding: clamp(6px,1vw,12px); color: var(--ink); width: 100%;
    background: transparent; border: none; box-shadow: none;
  }
  .feat-media { width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; position: relative; flex-shrink: 0; }
  .feat-body { display: flex; flex-direction: column; }
  .feat-card h3 { margin: 0 0 10px; font-size: clamp(1.7rem,4vw,2.5rem); font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
  .feat-card p { margin: 0; font-size: clamp(15px,1.7vw,17px); line-height: 1.5; color: #555049; }
  @media (min-width: 780px) {
    .feat-card { flex-direction: row; align-items: center; gap: clamp(28px,4vw,60px); width: 74%; padding: clamp(4px,0.8vw,12px); }
    .feat-media { width: clamp(160px,30%,240px); aspect-ratio: 4 / 3; }
    .feat-body { flex: 1; }
    .feat-left { align-self: flex-start; }
    .feat-right { align-self: flex-end; flex-direction: row-reverse; }
    .feat-right .feat-body { padding-left: clamp(48px,9vw,150px); }
  }
  /* feature media inner */
  .fm { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .fm-shot { background: #fff; border-radius: 18px; overflow: hidden; }
  .fm-shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .feat-media:has(.fm-shot) { aspect-ratio: 7 / 8; }

  /* ── full-bleed clay sections ── */
  .trust, .closing { position: relative; overflow: hidden; }
  .trust { color: #fff; padding: clamp(56px,9vw,120px) 22px; margin-top: clamp(18px,3vw,36px); }
  .trust-light { background: var(--paper); }
  .trust-light, .trust-light h2 { color: var(--ink); }
  .trust-light .eyebrow-light { color: var(--green-deep); }
  .trust-light .ball-dot { background: var(--lime); box-shadow: 0 0 0 3px rgba(207,228,20,0.3); }
  .trust.trust-light p { color: var(--ink); }
  .closing-photo {
    background: url('assets/clay-court-left.jpg');
    background-size: cover; background-position: center;
    color: #fff;
    padding: clamp(54px,9vw,116px) 22px;
  }
  .closing h2, .closing p { text-shadow: 0 2px 14px rgba(20,6,2,0.45); }
  .court-lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.9; pointer-events: none; }
  .krossi-root[data-court='off'] .court-lines { display: none; }
  .trust-inner { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .trust h2 { margin: 0; font-size: clamp(2rem,6vw,3.4rem); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; }
  .trust p { margin: 0; font-size: clamp(1rem,2.3vw,1.2rem); line-height: 1.5; color: rgba(255,255,255,0.86); max-width: 54ch; }
  .city-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
  .city-pill { background: rgba(14,59,44,0.06); color: var(--green-deep); font-weight: 700; font-size: 14px; padding: 7px 16px; border-radius: 999px; border: 1px solid rgba(14,59,44,0.14); }

  /* ── clubs ── */
  .clubs { max-width: 1120px; margin: 0 auto; padding: clamp(40px,7vw,80px) 22px; }
  .clubs-card {
    background: var(--green-deep); border-radius: 30px; color: #fff;
    padding: clamp(28px,5vw,54px); display: flex; gap: 30px; align-items: center;
    justify-content: space-between; flex-wrap: wrap;
  }
  .clubs-text { flex: 1; min-width: 260px; }
  .clubs-text h2 { margin: 0 0 14px; font-size: clamp(1.7rem,4.6vw,2.6rem); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
  .clubs-text p { margin: 0 0 24px; font-size: 1.05rem; line-height: 1.5; color: rgba(255,255,255,0.82); max-width: 48ch; }
  .clubs-text .btn-outline { color: #fff; }
  .clubs-deco { flex-shrink: 0; }
  .clubs-deco img { width: clamp(96px,15vw,160px); height: auto; display: block; filter: drop-shadow(0 12px 28px rgba(0,0,0,0.4)); }

  /* ── closing ── */
  .closing { text-align: center; }
  .closing-inner { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .closing h2 { margin: 0; font-size: clamp(2.6rem,8.5vw,4.2rem); font-weight: 800; letter-spacing: -0.03em; }
  .closing p { margin: 0 0 6px; font-size: clamp(1.02rem,2.3vw,1.2rem); color: rgba(255,255,255,0.86); }
  .closing-stores { padding: 22px 22px clamp(36px,8vw,56px); }

  /* ── mobile tweaks ── */
  .demo-label { display: none; }
  @media (max-width: 779px) {
    .feat-media:has(.fm-shot) { max-width: 60%; }
    .feat-kind-shot.feat-left .feat-media { margin-left: auto; }
    .feat-kind-shot.feat-right .feat-media { margin-right: auto; }
    .feat-kind-ui .feat-media { aspect-ratio: auto; max-width: 340px; margin: 0 auto; }
    .clubs-card { flex-wrap: nowrap; align-items: flex-start; gap: 14px; }
    .clubs-text { min-width: 0; }
    .clubs-deco img { width: 56px; }
    .clubs-text h2 br { display: none; }
    .footer-base { max-width: 58%; line-height: 1.5; }
    .closing-photo { background-size: cover; background-position: center; aspect-ratio: 16/9; padding: 20px 22px; }
    .hero-cta { flex-direction: column; align-items: stretch; width: 100%; max-width: 380px; align-self: center; gap: 10px; }
    .hero-cta > a { width: 100%; }
    .hero-points { justify-content: center; }
    .store-row { justify-content: center; }
    .hero-fine { display: none; }
    .hero { gap: 8px; }
    .demo-label { display: block; font-size: 13px; font-weight: 600; color: #8a857a; text-align: center; margin-bottom: 4px; }
  }

  /* ── footer (light + tennis balls) ── */
  .footer { position: relative; overflow: hidden; background: var(--paper); color: var(--ink); padding: clamp(48px,8vw,88px) 22px clamp(30px,4vw,44px); }
  .footer::after {
    content: ''; position: absolute; right: -1%; bottom: -4%;
    width: min(44%, 380px); aspect-ratio: 620 / 430;
    background: url('assets/tennisballs.avif') right bottom / contain no-repeat;
    pointer-events: none;
  }
  .footer-inner { max-width: 1120px; margin: 0 auto; position: relative; z-index: 1; }
  .footer-tag { color: #4a463d; margin: 14px 0 22px; font-size: clamp(1.1rem,3vw,1.4rem); font-weight: 600; }
  .footer-links { display: flex; flex-direction: column; gap: 6px; }
  .footer-links a { color: var(--green-deep); text-decoration: none; font-weight: 700; font-size: 15px; }
  .footer-links span { color: #8a857a; font-size: 15px; }
  .footer-base { margin-top: clamp(28px,4vw,44px); padding-top: 0; border-top: none; color: #8a857a; font-size: 13px; }

  /* ── upcoming matches ── */
  .upcoming { max-width: 1120px; margin: 0 auto; padding: clamp(20px,4vw,48px) 22px clamp(34px,5vw,60px); }
  .upcoming-inner { }
  .upcoming-header { text-align: center; margin-bottom: clamp(24px,4vw,40px); }
  .upcoming-title { font-size: clamp(2rem,5.5vw,3.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 10px 0 12px; }
  .upcoming-sub { font-size: clamp(0.95rem,2vw,1.12rem); color: #6b665c; max-width: 50ch; margin: 0 auto; line-height: 1.5; }
  .upcoming-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 920px; margin: 0 auto; }
  .upcoming-card {
    display: flex; flex-direction: column; gap: 10px;
    background: #fff; border: 1.5px solid #e6e2d8; border-radius: 20px;
    padding: 18px 20px; text-decoration: none; color: var(--ink);

    cursor: pointer;

  .upcoming-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px -12px rgba(40,20,6,0.18); border-color: var(--lime); }

  .uc-type {

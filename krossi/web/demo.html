<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kokeile Krossia — demo</title>
<meta name="description" content="Kokeile Krossia ilman tiliä: selaa pelaajia, liity peleihin ja katso miten pelin sopiminen toimii." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0E3B2C" />
<meta property="og:title" content="Kokeile Krossia — demo" />
<meta property="og:description" content="Näe miten tennispelin sopiminen Krossissa toimii — ilman tiliä." />
<meta property="og:image" content="https://krossi.app/krossi/static/og-image.png" />
<link rel="icon" type="image/png" href="/krossi/static/favicon.png" />
<link rel="apple-touch-icon" href="/krossi/static/icon-180.png" />
<link rel="stylesheet" href="/krossi/app.css" />
<style>
  html, body { margin: 0; background: #F7F5EF; }
  .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0E3B2C; }
  .boot-ball { display: block; animation: boot-bounce .9s cubic-bezier(.5,0,.5,1) infinite alternate; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
  .boot-shadow { width: 44px; height: 8px; margin: 14px auto 0; border-radius: 50%; background: rgba(0,0,0,.25); animation: boot-shadow .9s cubic-bezier(.5,0,.5,1) infinite alternate; }
  @keyframes boot-bounce { from { transform: translateY(-30px) rotate(-20deg); } to { transform: translateY(0) rotate(45deg); } }
  @keyframes boot-shadow { from { transform: scale(.55); opacity: .5; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .boot-ball, .boot-shadow { animation: none; } }
</style>
</head>
<body>
  <div id="root"><div class="boot" aria-label="Ladataan Krossin demoa"><div><svg class="boot-ball" width="52" height="52" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="bootg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#E4F25A"/><stop offset=".7" stop-color="#CFE414"/><stop offset="1" stop-color="#B9CC0E"/></radialGradient><clipPath id="bootc"><circle cx="50" cy="50" r="46"/></clipPath></defs><circle cx="50" cy="50" r="46" fill="url(#bootg)"/><g clip-path="url(#bootc)" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"><path d="M10 30c18-6 40-4 56 8s22 22 28 32"/><path d="M30 80c14 7 34 6 50-6"/></g></svg><div class="boot-shadow"></div></div></div></div>
  <noscript>Krossi tarvitsee JavaScriptin toimiakseen.</noscript>
  <script src="/krossi/demo.js" defer></script>
</body>
</html>
